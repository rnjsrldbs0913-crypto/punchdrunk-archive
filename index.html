<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17131d" data-customer-theme-color />
  <title>PUNCH-DRUNK ARCHIVE</title>
  <meta name="description" content="PUNCH-DRUNK MUSIC BAR DAEGU의 음반 아카이브입니다." />
  <meta property="og:title" content="PUNCH-DRUNK ARCHIVE" />
  <meta property="og:description" content="PUNCH-DRUNK MUSIC BAR DAEGU의 추천 음반과 보유 음반을 둘러보세요." />
  <meta property="og:image" content="logo-punchdrunk-circle.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="logo-punchdrunk-circle.png" />
  <link rel="apple-touch-icon" href="logo-punchdrunk-circle.png" />
  <script src="customer-config.js?v=20260817a"></script>
  <script src="customer-theme.js?v=20260817a"></script>
  <link rel="stylesheet" href="styles.css?v=20260810b" />
  <link rel="stylesheet" href="customer-polish.css?v=20260810b" />
  <link rel="stylesheet" href="customer-modern.css?v=20260817a" />
  <link rel="stylesheet" href="customer-color-field.css?v=20260814d" />
</head>
<body class="customer-page">
  <div class="app-shell">
    <header class="site-header">
      <button class="site-home-button" data-home-link type="button" aria-label="처음 화면으로 돌아가기" data-i18n-aria="homeLabel">
        <img class="site-logo" src="logo-punchdrunk-circle.png" alt="PUNCH-DRUNK MUSIC BAR DAEGU KOREA" />
      </button>
      <div class="customer-brand-wordmark" aria-hidden="true">
        <strong>PUNCH-DRUNK</strong>
        <span>MUSIC BAR · DAEGU</span>
      </div>
      <div class="customer-header-controls">
        <button class="customer-theme-toggle" type="button" data-customer-theme-toggle aria-label="라이트 모드로 변경" title="라이트 모드로 변경">
          <span class="customer-theme-symbol" data-customer-theme-icon aria-hidden="true">☀</span>
          <span class="customer-theme-art" aria-hidden="true">
            <img class="customer-theme-art-off" src="media/theme-phone-light-off.webp" alt="" />
            <img class="customer-theme-art-on" src="media/theme-phone-light-on.webp" alt="" />
          </span>
        </button>
        <nav class="language-switch" aria-label="언어 선택" data-i18n-aria="languageLabel">
          <button type="button" data-language-option="ko" aria-pressed="true" title="한국어">
            <span>KR</span>
          </button>
          <button type="button" data-language-option="en" aria-pressed="false" title="English">
            <span>EN</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="app" aria-live="polite">
      <!-- 2026-08-10 로딩 실패 안내: app.js가 정상 실행되면 이 내용은 즉시 실제 화면으로 교체됩니다. -->
      <section class="app-load-fallback">
        <strong>음반 목록을 불러오지 못했습니다.</strong>
        <p>인터넷 연결을 확인한 뒤 다시 불러와주세요.</p>
        <a href="index.html">다시 불러오기</a>
      </section>
      <noscript>
        <section class="app-load-noscript">
          <strong>JavaScript가 꺼져 있어 음반 목록을 열 수 없습니다.</strong>
          <p>브라우저 설정에서 JavaScript를 허용한 뒤 다시 열어주세요.</p>
        </section>
      </noscript>
    </main>
  </div>

  <template id="home-template">
    <section class="weekly-section" aria-label="금주의 음반" data-i18n-aria="weeklyAlbum">
      <div class="section-heading">
        <p class="section-kicker" data-i18n="weeklyAlbum">금주의 음반</p>
        <p class="section-note" data-i18n="weeklyNote">이번 주 가장 먼저 들어볼 음반</p>
      </div>
      <button class="weekly-card" type="button" data-weekly-open>
        <video
          class="weekly-motion-video"
          data-weekly-motion-video
          muted
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          aria-hidden="true"
          hidden
        ></video>
        <span class="weekly-motion-scrim" data-weekly-motion-scrim aria-hidden="true" hidden></span>
        <div class="weekly-cover" data-weekly-cover></div>
        <div class="weekly-meta">
          <div class="weekly-info">
            <span class="pill" data-weekly-format></span>
            <h1 data-weekly-title></h1>
            <p data-weekly-artist></p>
            <p class="weekly-year" data-weekly-year></p>
          </div>
          <div class="weekly-reason">
            <span data-i18n="selectionReason">선정 이유</span>
            <p data-weekly-reason></p>
          </div>
          <span class="weekly-cta" data-i18n="details">자세히 보기</span>
        </div>
        <span class="weekly-motion-indicator" data-weekly-motion-indicator aria-hidden="true" hidden></span>
      </button>
    </section>

    <aside class="request-guide" aria-label="신청 안내" data-i18n-aria="requestGuideTitle">
      <p class="request-guide-label" data-i18n="requestGuideTitle">신청 안내</p>
      <p class="request-guide-text">
        <span data-i18n="requestGuideLine1">신청곡은 받으신 신청 용지에 적어 직원에게 건네주세요.</span>
        <span data-i18n="requestGuideLine2">리스트에 없는 곡은 스트리밍으로 재생됩니다.</span>
      </p>
    </aside>

    <section class="search-section" aria-label="검색과 필터" data-i18n-aria="searchSection">
      <label class="search-label" for="search-input" data-i18n="albumSearch">검색</label>
      <div class="search-input-wrap">
        <input id="search-input" class="search-input" type="search" placeholder="음반명·아티스트·곡 제목" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
        <button class="search-clear-button" type="button" data-search-clear aria-label="검색어 지우기" data-i18n-aria="clearSearch" hidden></button>
      </div>
      <button class="filter-panel-toggle" type="button" data-filter-toggle aria-expanded="false" aria-controls="album-filter-panel">
        <span data-i18n="filters">필터</span>
        <span class="filter-toggle-summary" data-filter-toggle-summary></span>
        <span class="filter-toggle-chevron" aria-hidden="true"></span>
      </button>
      <div class="filter-panel" id="album-filter-panel" data-filter-panel hidden>
        <div class="search-tools">
          <label class="sort-label">
            <span data-i18n="sort">정렬</span>
            <select data-sort-select>
              <option value="default" data-i18n="sortDefault">기본순</option>
              <option value="newest" data-i18n="sortNewest">최근 발매순</option>
              <option value="oldest" data-i18n="sortOldest">오래된순</option>
              <option value="artist" data-i18n="sortArtist">아티스트순</option>
              <option value="title" data-i18n="sortTitle">앨범명순</option>
            </select>
          </label>
          <button class="tool-button" type="button" data-new-albums data-i18n="newAlbums" aria-pressed="false">새로 온 음반</button>
          <button class="tool-button" type="button" data-reset-filters data-i18n="resetFilters">필터 초기화</button>
        </div>
        <div class="filter-row format-row" data-format-filters></div>
        <div class="filter-scroll-shell" data-genre-scroll-shell>
          <div class="filter-row genre-row" data-genre-filters></div>
        </div>
      </div>
      <div class="result-summary-row">
        <div class="result-summary" data-result-summary></div>
        <div class="result-action-buttons">
          <button class="tool-button request-list-button" type="button" data-request-list>신청곡 메모 0</button>
          <!-- 랜덤 음반은 필터와 무관한 탐색 기능이므로 결과 요약 옆에 따로 둡니다. -->
          <button class="tool-button result-random-button" type="button" data-random-album data-i18n="randomAlbum">오늘 뭐 듣지?</button>
        </div>
      </div>
    </section>

    <section class="grid-section" data-grid-section aria-label="앨범 목록" data-i18n-aria="albumList">
      <div class="album-grid" data-album-grid></div>
      <p class="empty-message" data-empty-message hidden data-i18n="emptyAlbums">조건에 맞는 음반이 없습니다.</p>
      <nav class="pagination" data-pagination aria-label="앨범 목록 페이지" data-i18n-aria="albumListPage"></nav>
    </section>
  </template>

  <template id="detail-template">
    <article class="detail-page">
      <div class="detail-top-actions">
        <button class="back-button" type="button" data-history-back data-i18n="previousView">← 이전 화면</button>
        <button class="back-button album-list-button" type="button" data-album-list data-i18n="albumListButton">음반 목록</button>
      </div>
      <div class="detail-cover-wrap" data-detail-cover></div>
      <div class="detail-head">
        <div class="detail-tags" data-detail-tags></div>
        <h1 data-detail-title></h1>
        <p data-detail-artist></p>
      </div>
      <section class="detail-section">
        <div class="detail-section-heading">
          <h2 data-i18n="tracklist">트랙리스트</h2>
          <button class="detail-request-list-button" type="button" data-request-list>신청곡 메모 0</button>
        </div>
        <ol class="tracklist" data-detail-tracklist></ol>
        <p class="tracklist-hint"><span class="tiny-dot"></span> <span data-i18n="recommendedHint">표시는 추천곡입니다.</span></p>
      </section>
      <section class="detail-section">
        <h2 data-i18n="description">설명</h2>
        <p class="description" data-detail-description></p>
      </section>
      <p class="request-note" data-request-note></p>
      <nav class="detail-nav" aria-label="다른 음반 보기" data-i18n-aria="otherAlbums">
        <button type="button" data-prev-album data-i18n="prevAlbum">이전 음반</button>
        <button type="button" data-random-album data-i18n="randomAlbum">오늘 뭐 듣지?</button>
        <button type="button" data-next-album data-i18n="nextAlbum">다음 음반</button>
      </nav>
    </article>
  </template>

  <script src="albums-data.js?v=20260808142142"></script>
  <script src="app.js?v=20260811a"></script>
</body>
</html>
